{% load static i18n %}<!doctype html>
{% get_current_language as LANG %}
<html lang="{{ LANG }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %} | Aktiv Fleet</title>
    <link rel="icon" href="{% static 'images/logo/logo-icon.svg' %}" type="image/svg+xml" />
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    <script>
      if (JSON.parse(localStorage.getItem("darkMode") || "false")) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  </head>
  <body x-data="{ darkMode: JSON.parse(localStorage.getItem('darkMode') || 'false') }"
        :class="{ 'dark bg-gray-900': darkMode }">
    <div class="relative z-1 bg-white p-6 sm:p-0 dark:bg-gray-900">
      <div class="relative flex h-screen w-full flex-col justify-center sm:p-0 lg:flex-row dark:bg-gray-900">
        <div class="flex w-full flex-1 flex-col lg:w-1/2">
          <div class="mx-auto flex w-full max-w-md justify-end pt-6">
            {% include "partials/language_switch.html" %}
          </div>
          <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center">
            {% block content %}{% endblock %}
          </div>
        </div>

        <div class="relative hidden h-full w-full items-center bg-brand-950 lg:grid lg:w-1/2 dark:bg-white/5">
          <div class="flex flex-col items-center gap-4 px-10 text-center">
            <img class="h-12" src="{% static 'images/logo/logo-dark.svg' %}" alt="Aktiv Fleet" />
            <p class="max-w-xs text-gray-400 dark:text-white/60">
              {% translate "Vehicles, drivers, fuel, service and store in one place." %}
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
