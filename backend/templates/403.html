{% extends "base_auth.html" %}
{% load i18n %}
{% block title %}{% translate "No access" %}{% endblock %}
{% block content %}
<h1 class="mb-2 text-title-sm font-semibold text-gray-800 dark:text-white/90">{% translate "No access" %}</h1>
<p class="mb-6 text-sm text-gray-500 dark:text-gray-400">{% translate "Your role cannot open this page." %}</p>
{% if user.is_authenticated %}
<form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
  <button class="rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white hover:bg-brand-600">{% translate "Log out" %}</button>
</form>
{% endif %}
{% endblock %}
