{% if place %}<span class="font-medium" data-place="{{ place.pk }}">{{ place.name }}</span>{% else %}<a href="https://www.openstreetmap.org/?mlat={{ point.y|stringformat:'.5f' }}&amp;mlon={{ point.x|stringformat:'.5f' }}#map=16/{{ point.y|stringformat:'.5f' }}/{{ point.x|stringformat:'.5f' }}" target="_blank" rel="noopener" class="whitespace-nowrap text-brand-500 hover:underline">{{ point.y|stringformat:'.5f' }}, {{ point.x|stringformat:'.5f' }}</a>{% endif %}
